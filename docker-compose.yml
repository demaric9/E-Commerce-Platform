version: "3.8"

services:
  airflow-webserver:
    image: apache/airflow:2.9.0-python3.10
    container_name: airflow_webserver
    command: >
      bash -c "
        pip install minio &&
        pip install duckdb &&
        pip install dbt-core && 
        pip install dbt-duckdb &&
        airflow webserver"
    ports:
      - 8080:8080
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user_ecommerce_db:user_ecommerce_db@host.docker.internal:5432/ecommerce_db
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./python_script:/opt/airflow/python_script 
      - ./cfg:/opt/airflow/cfg
      - ./ecommerce_db.duckdb:/opt/airflow/ecommerce_db.duckdb
      - ./data:/opt/airflow/data
      - ./ecommerce_dbt:/opt/airflow/ecommerce_dbt
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    image: apache/airflow:2.9.0-python3.10
    container_name: airflow_scheduler
    command: >
      bash -c "
        pip install minio &&
        pip install duckdb &&
        pip install dbt-core && 
        pip install dbt-duckdb &&
        airflow scheduler"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user_ecommerce_db:user_ecommerce_db@host.docker.internal:5432/ecommerce_db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./python_script:/opt/airflow/python_script 
      - ./cfg:/opt/airflow/cfg
      - ./ecommerce_db.duckdb:/opt/airflow/ecommerce_db.duckdb
      - ./data:/opt/airflow/data
      - ./ecommerce_dbt:/opt/airflow/ecommerce_dbt
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-init:
    image: apache/airflow:2.9.0-python3.10
    container_name: airflow_init
    command: >
      bash -c "
        pip install minio &&
        pip install duckdb &&
        pip install dbt-core && 
        pip install dbt-duckdb &&
        airflow db migrate"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user_ecommerce_db:user_ecommerce_db@host.docker.internal:5432/ecommerce_db
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./python_script:/opt/airflow/python_script 
      - ./cfg:/opt/airflow/cfg
      - ./ecommerce_db.duckdb:/opt/airflow/ecommerce_db.duckdb
      - ./data:/opt/airflow/data
      - ./ecommerce_dbt:/opt/airflow/ecommerce_dbt
