version: 2 

models:
  - name: int_customer
    description: "Intermediate customer enriched"
    columns:
      - name: customer_id
        description: "Customer id for customer"
        tags: ['test_intermediate']
        tests:
          - not_null
          # - unique
      - name: customer_unique_id
        description: "Real customer id for customer"
        tags: ['test_intermediate']
        tests:
          - not_null
  - name: int_seller
    description: "Intermediate seller enriched"
    columns:
      - name: seller_id
        description: "Real seller id"
        tags: ['test_intermediate']
        tests:
          - not_null
          # - unique
      - name: seller_zip_code
        description: "Seller zip_code address"
        tags: ['test_intermediate']
        tests:
          - not_null
  - name: int_product
    description: "Intermediate product enriched"
    columns:
      - name: product_id
        description: Unique identifier for the product.
        tags: ['test_intermediate']
        tests:
          - not_null
          # - unique
          - relationships:
              to: ref('stg_product')
              field: product_id
      - name: category_name
        description: Original product category name in Portuguese.
        tags: ['test_intermediate']
        tests:
          - not_null
          - relationships:
              to: ref('stg_translation_product_category')
              field: product_category_name
      - name: product_category_name_english
        description: Translated product category name in English.
        tags: ['test_intermediate']
        tests:
          - not_null 
  - name: int_region
    description: "Intermediate region enriched"
    columns:
      - name: geolocation_zip_code_prefix
        description: "Geolocation zip code"
        tags: ['test_intermediate']
        tests:
          - not_null
          - unique
  - name: int_reviews
    description: "Intermediate reviews enriched"
    columns:
      - name: review_id
        description: "Review id"
        tags: ['test_intermediate']
        tests:
          - not_null 
          - unique
      - name: review_creation_date
        description: "Review create date" 
        tags: ['test_intermediate']
        tests:
          - not_null
      - name: order_id
        description: "Order id"
        tags: ['test_intermediate']
        tests:
          - not_null
  - name: int_orders_items
    description: "Intermediate order items enriched"
    columns:
      - name: order_id
        description: "Order id of a item"
        tags: ['test_intermediate']
        tests:
          - not_null
      - name: customer_id
        description: "Customer id of a item"
        tags: ['test_intermediate']
        tests:
          - not_null
      - name: product_id
        description: "Product id of a item" 
        tags: ['test_intermediate']
        tests:
          - not_null
      - name: seller_id
        description: "Seller id of a item"
        tags: ['test_intermediate']
        tests:
          - not_null
      - name: order_date
        description: "Order date"
        tags: ['test_intermediate']
        tests:
          - not_null
      # - name: delivery_status_check
      #   tests:
      #     - accepted_values:
      #         values:
      #           - ['missing', 'ok', 'not applicable']