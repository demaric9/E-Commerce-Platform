        tests:
          - not_null
      - name: date_key
        tags: ['test_mart']
        tests:
          - not_null
      - name: customer_key
        tags: ['test_mart']
        tests:
          - not_null
      - name: product_key
        tags: ['test_mart']
        tests:
          - not_null
      - name: seller_key
        tags: ['test_mart']
