        tags: ['test_mart']
        tests:
          - not_null
  - name: dim_product
    columns:
      - name: product_key
        tags: ['test_mart']
        tests:
          - not_null
  - name: dim_seller
    columns:
      - name: seller_key
        tags: ['test_mart']
        tests:
