version: 2

models:
  - name: fact_order_items
    description: "Mart order items"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: date_key
        tests:
          - not_null
      - name: customer_key
        tests:
          - not_null
      - name: product_key
        tests:
          - not_null
      - name: seller_key
        tests:
          - not_null
  - name: fact_order_payment
    columns:
      - name: order_key
        tests:
          - not_null
  - name: fact_order_reviews
    columns:
      - name: order_key
        tests:
          - not_null
  - name: dim_order 
    columns:
      - name: order_key 
        tests:
          - not_null
          - unique
  - name: dim_customer
    columns:
      - name: customer_key
        tests:
          - not_null
  - name: dim_product
    columns:
      - name: product_key
        tests:
          - not_null
  - name: dim_seller
    columns:
      - name: seller_key
        tests:
          - not_null
  